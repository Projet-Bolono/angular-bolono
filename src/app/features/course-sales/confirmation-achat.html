@let a = achat();
<form class="flex flex-wrap items-end gap-2" (submit)="$event.preventDefault(); envoyer()">
  <label class="text-xs font-semibold text-muted-strong">
    Montant reçu (FCFA)
    <input
      class="input mt-1 w-36! py-2!"
      type="number"
      min="0"
      name="montant"
      [(ngModel)]="montant"
      required
    />
  </label>
  <label class="text-xs font-semibold text-muted-strong">
    Référence de l'opération
    <input
      class="input mt-1 w-52! py-2!"
      name="operation"
      [(ngModel)]="operation"
      maxlength="100"
      required
      placeholder="ID Orange Money / Wave"
    />
  </label>
  <button
    class="btn-accent btn-sm"
    type="submit"
    [disabled]="occupe() || !operation.trim() || montant === null"
  >
    <app-icon name="check-circle" [size]="15" /> Confirmer
  </button>
  <button class="btn-outline btn-sm" type="button" [disabled]="occupe()" (click)="refuser.emit()">
    <app-icon name="x-circle" [size]="15" /> Pas reçu
  </button>
  @if (montant !== null && montant < a.montant) {
    <p class="w-full text-2xs text-error">
      Inférieur aux {{ fcfa(a.montant) }} attendus : le serveur refusera.
    </p>
  }
</form>
